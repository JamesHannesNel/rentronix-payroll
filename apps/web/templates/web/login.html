{% load static %}<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Rentronix Payroll</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'web/app.css' %}">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="brand brand-dark"><span class="brand-mark" aria-hidden="true"></span><span>Rentronix<br><b>Payroll</b></span></p>
    <h1>Sign in</h1>
    {% if form.errors %}<p class="flash-error">That username and password don't match. Try again.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="id_username">Username</label>
      <input id="id_username" name="username" autocomplete="username" autofocus required value="{{ form.username.value|default:'' }}">
      <label for="id_password">Password</label>
      <input id="id_password" name="password" type="password" autocomplete="current-password" required>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
