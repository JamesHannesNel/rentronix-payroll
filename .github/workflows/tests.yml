# Runs the tests on GitHub every time code is pushed.
# A green tick next to a commit on GitHub means they passed.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payroll
          POSTGRES_PASSWORD: payroll
          POSTGRES_DB: payroll
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payroll" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://payroll:payroll@localhost:5432/payroll
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
